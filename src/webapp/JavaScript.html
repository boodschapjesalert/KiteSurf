  function bouwGrafiekVlaagLijnSvg(zichtbareUren, maxKn) {
    var reeks = zichtbareUren.map(function (u) { return u.ruw ? u.ruw.windvlaagKnopen : null; });
    var geldig = reeks.filter(function (kn) { return kn != null; });
    if (geldig.length < 2) return '';
    var schaal = maxKn || Math.max.apply(null, geldig) || 1;

    var segmenten = [];
    var huidigSegment = [];
    reeks.forEach(function (kn, i) {
      if (kn == null) {
        if (huidigSegment.length > 1) segmenten.push(huidigSegment);
        huidigSegment = [];
        return;
      }
      var x = reeks.length > 1 ? (i / (reeks.length - 1)) * 100 : 50;
      // 100 = onderkant, 0 = bovenkant; zelfde 0..maxKn-schaal als de balken eronder.
      var y = Math.max(2, 100 - (kn / schaal) * 100);
      huidigSegment.push(x.toFixed(1) + ',' + y.toFixed(1));
    });
    if (huidigSegment.length > 1) segmenten.push(huidigSegment);
    if (segmenten.length === 0) return '';

    var polylines = segmenten.map(function (punten) {
      return '<polyline points="' + punten.join(' ') + '"></polyline>';
    }).join('');
    return '<svg class="grafiek-windlijn" viewBox="0 0 100 100" preserveAspectRatio="none">' + polylines + '</svg>';
  }

  // __ONBOARDING_WIZARD_LOGICA__
  var wizardLogica = window.KiteweerOnboardingLogica || window.KiteweerLogica;
  var WIZARD_AANTAL_STAPPEN = 6;
  var wizardConcept = null;
  var wizardHuidigeStap = 0;

  function leesNummerInput(id) {
    var el = document.getElementById(id);
    if (!el) return null;
    var raw = el.value.trim();
    return raw === '' ? null : Number(raw);

  function formatGetalOfLeeg(x) {
    return x == null ? 'leeg (neutraal)' : String(x);
  }

  function voegWizardUitlegToe(container, introTekst, items) {

  function leesWizardStapUitDom(stapIndex) {
    if (!wizardConcept) return;
    if (stapIndex === 0) {
      wizardConcept.windsnelheid.minimum = leesNummerInput('wiz-wind-minimum');
      wizardConcept.windsnelheid.ideaalOnder = leesNummerInput('wiz-wind-ideaalOnder');
      wizardConcept.windsnelheid.ideaalBoven = leesNummerInput('wiz-wind-ideaalBoven');
      wizardConcept.windsnelheid.maximum = leesNummerInput('wiz-wind-maximum');
    } else if (stapIndex === 1) {
      wizardConcept.windvlagen.waarschuwingVlaagfactor = leesNummerInput('wiz-vlaag-waarschuwing');
      wizardConcept.windvlagen.maxVlaagfactor = leesNummerInput('wiz-vlaag-max');
    } else if (stapIndex === 2) {
      var su = leesNummerInput('wiz-dagvenster-start');
      var eu = leesNummerInput('wiz-dagvenster-eind');
      var ms = leesNummerInput('wiz-minimalesessieuren');
      var dv = leesNummerInput('wiz-dagenvooruit');
      wizardConcept.dagvenster.startUur = su != null ? su : wizardConcept.dagvenster.startUur;
      wizardConcept.dagvenster.eindUur = eu != null ? eu : wizardConcept.dagvenster.eindUur;
      wizardConcept.minimaleSessieUren = ms != null ? ms : wizardConcept.minimaleSessieUren;
      wizardConcept.dagenVooruit = dv != null ? dv : wizardConcept.dagenVooruit;
    } else if (stapIndex === 3) {
      var hardNoGo = document.getElementById('wiz-onweer-hardNoGo');
      if (hardNoGo) wizardConcept.onweer.hardNoGo = hardNoGo.checked;
      wizardConcept.onweer.neerslagWaarschuwingDrempel = leesNummerInput('wiz-onweer-neerslag');
      wizardConcept.langdurigeRegen.minimumUrenAchtereen = leesNummerInput('wiz-regen-uren');
      wizardConcept.langdurigeRegen.minimumMmPerUur = leesNummerInput('wiz-regen-mm');
      wizardConcept.luchttemperatuur.minimumComfortabel = leesNummerInput('wiz-lucht-min');
      wizardConcept.watertemperatuur.minimumComfortabel = leesNummerInput('wiz-water-comfort');
      wizardConcept.watertemperatuur.minimumMetWetsuit = leesNummerInput('wiz-water-wetsuit');

  function werkWizardWindBalkBij(balkEl) {
    if (!balkEl || !wizardConcept) return;
    var w = wizardConcept.windsnelheid;
    var min = w.minimum != null ? w.minimum : '?';
    var io = w.ideaalOnder != null ? w.ideaalOnder : '?';
    var ib = w.ideaalBoven != null ? w.ideaalBoven : '?';
    var maxTekst = w.maximum != null ? ('> ' + w.maximum + ' kn') : 'geen max';
    balkEl.innerHTML =
      '<span class="wb-rood">&lt; ' + escapeHtml(min) + ' Rood</span>' +
      '<span class="wb-oranje">' + escapeHtml(min) + '–' + escapeHtml(io) + ' Oranje</span>' +
      '<span class="wb-groen">' + escapeHtml(io) + '–' + escapeHtml(ib) + ' Groen</span>' +
      '<span class="wb-rood">' + escapeHtml(maxTekst) + '</span>';
  }

  function werkWizardVlaagVoorbeeldBij(voorbeeldEl) {
    if (!voorbeeldEl || !wizardConcept || !wizardLogica) return;
    var w = wizardConcept.windsnelheid;
    var basis = (w.ideaalOnder != null && w.ideaalBoven != null) ? (w.ideaalOnder + w.ideaalBoven) / 2 : 20;
    var v = wizardConcept.windvlagen;
    var res = wizardLogica.berekenVlaagVoorbeeldKnopen(basis, v.waarschuwingVlaagfactor, v.maxVlaagfactor);
    if (res.waarschuwingKnopen == null && res.maxKnopen == null) {
      voorbeeldEl.textContent = 'Kies een preset of vul waarden in (bijv. 0.3 en 0.5) om direct het effect bij ' + res.basisKnopen + ' knopen wind te zien.';
    } else {
      var delen = [];
      if (res.waarschuwingKnopen != null) {
        delen.push('waarschuwing (oranje) vanaf ' + res.waarschuwingKnopen + ' kn (+' + res.waarschuwingPct + '%)');
      }
      if (res.maxKnopen != null) {
        delen.push('rood / no-go vanaf ' + res.maxKnopen + ' kn (+' + res.maxPct + '%)');
      }
      voorbeeldEl.textContent = 'Rekenvoorbeeld bij ' + res.basisKnopen + ' kn wind: ' + delen.join(', ') + '.';
    }
    var check = wizardLogica.valideerOnboardingStap(1, wizardConcept);
    if (check.waarschuwing) toonWizardMelding(check.waarschuwing, 'waarschuwing');
    else toonWizardMelding(null);
  }

  function openOnboardingWizard() {
    if (!wizardLogica || !profiel) {
      openInstellingen();
      return;
    }
    wizardConcept = wizardLogica.maakOnboardingConcept(profiel);
    wizardHuidigeStap = 0;
    document.getElementById('onboardingKaart').hidden = true;
    verberg('instellingenSectie');
    try { localStorage.setItem(ONBOARDING_GEZIEN_SLEUTEL, '1'); } catch (e) {}
    toon('onboardingWizard');
    renderWizardStap();
    springNaar('onboardingWizard');
  }

    verberg('onboardingWizard');
    try { localStorage.setItem(ONBOARDING_GEZIEN_SLEUTEL, '1'); } catch (e) {}
    werkConfiguratieBannerBij();
  }

  function gaNaarWizardStap(nieuweStap) {
    leesWizardStapUitDom(wizardHuidigeStap);
    if (nieuweStap > wizardHuidigeStap) {
      var check = wizardLogica.valideerOnboardingStap(wizardHuidigeStap, wizardConcept);
      if (!check.ok) {
        toonWizardMelding(check.fouten[0], 'fout');
        return;
      }
    }
    wizardHuidigeStap = Math.max(0, Math.min(WIZARD_AANTAL_STAPPEN - 1, nieuweStap));
    renderWizardStap();
    springNaar('onboardingWizard');
  }

  function slaOnboardingWizardOp() {
    leesWizardStapUitDom(wizardHuidigeStap);
    var check = wizardLogica.valideerOnboardingStap(wizardHuidigeStap, wizardConcept);
    if (!check.ok) {
      toonWizardMelding(check.fouten[0], 'fout');
      return;
    }
    profiel = wizardLogica.pasOnboardingConceptToeOpProfiel(profiel, wizardConcept);
    var knop = document.getElementById('wizardVolgendeKnop');
    var oorspronkelijk = knop.textContent;
    slaProfielOp(function () {
      werkConfiguratieBannerBij();
      knop.textContent = '✓ Opgeslagen';
      setTimeout(function () {
        knop.textContent = oorspronkelijk;
        verberg('onboardingWizard');
        if (huidigeLocatie) kiesLocatie(huidigeLocatie);
      }, 600);
    });
  }

  // --- Windrichting-editor (per spot): kompasvakjes of graden ---
  //
  // Eén herbruikbaar component voor drie plekken: een nieuwe spot toevoegen, een bestaande spot
  // aanpassen (🧭 bij de spot, en onder ⚙️ Instellingen / in de Instelhulp). De opslag blijft
  // altijd graden-ranges (zie windrichtingKeuze.js); kompas/graden is alleen de invoer/weergave.

  var windrichtingHuidig = null;
  var windrichtingTerugTeZetten = [];

  function wrEl(tag, klasse, tekst) {
    var el = document.createElement(tag);
    if (klasse) el.className = klasse;
    if (tekst != null) el.textContent = tekst;
    return el;
  }

  function wrKopieerRanges(ranges) {
    return (ranges || []).map(function (r) { return [r[0], r[1]]; });
  }

  function bouwWindrichtingEditor(opties) {
    var wrapper = wrEl('div');
    var origineel = opties.windrichting || { besteRanges: [], acceptabeleRanges: [] };
    var modus = opties.modus === 'graden' ? 'graden' : 'kompas';
    var standen = windrichtingLogica.windrichtingNaarSectorStanden(origineel);
    var bereiken = { beste: wrKopieerRanges(origineel.besteRanges), matig: wrKopieerRanges(origineel.acceptabeleRanges) };
    var gewijzigd = false;
    var actieModus = 'slecht'; // 'slecht' (bereik markeren als ongeschikt) | 'goed' (bereik) | 'los' (per richting)
    var bereikStart = null;
    var samenvattingEl = null;

    // Huidige keuze als `windrichting` (of { fout }). Onaangeraakt blijft de opgeslagen waarde exact
    // behouden (kompasvakjes zijn een afronding op 22,5°-sectoren).
    function lees() {
      if (!gewijzigd) return { windrichting: { besteRanges: wrKopieerRanges(origineel.besteRanges), acceptabeleRanges: wrKopieerRanges(origineel.acceptabeleRanges) } };
      if (modus === 'kompas') return { windrichting: windrichtingLogica.sectorStandenNaarWindrichting(standen) };
      var uit = { besteRanges: [], acceptabeleRanges: [] };
      var fout = null;
      [['beste', 'besteRanges'], ['matig', 'acceptabeleRanges']].forEach(function (p) {
        bereiken[p[0]].forEach(function (r) {
          var van = Number(r[0]);
          var tot = Number(r[1]);
          if (r[0] === '' || r[1] === '' || !isFinite(van) || !isFinite(tot)) {
            fout = 'Vul bij elk bereik een geldige "van" en "tot" in (0–360°).';
            return;
          }
          uit[p[1]].push([van, tot]);
        });
      });
      return fout ? { fout: fout } : { windrichting: uit };
    }

    function werkSamenvattingBij() {
      if (!samenvattingEl) return;
      var r = lees();
      samenvattingEl.textContent = r.fout ? r.fout : '🧭 ' + windrichtingLogica.formatWindrichtingSamenvatting(r.windrichting, modus);
    }

    function laadUit(windrichting) {
      standen = windrichtingLogica.windrichtingNaarSectorStanden(windrichting);
      bereiken = { beste: wrKopieerRanges(windrichting.besteRanges), matig: wrKopieerRanges(windrichting.acceptabeleRanges) };
    }

    function bouwBereikRijen(type, titel) {
      var blok = wrEl('div');
      blok.appendChild(wrEl('strong', null, titel));
      bereiken[type].forEach(function (r, i) {
        var rij = wrEl('div', 'wr-bereik');
        var van = wrEl('input');
        van.type = 'number'; van.min = '0'; van.max = '360'; van.step = '1'; van.value = r[0];
        van.oninput = function () { r[0] = van.value; gewijzigd = true; werkSamenvattingBij(); };
        var tot = wrEl('input');
        tot.type = 'number'; tot.min = '0'; tot.max = '360'; tot.step = '1'; tot.value = r[1];
        tot.oninput = function () { r[1] = tot.value; gewijzigd = true; werkSamenvattingBij(); };
        var weg = wrEl('button', 'klein secundair', '✕');
        weg.type = 'button';
        weg.onclick = function () { bereiken[type].splice(i, 1); gewijzigd = true; render(); };
        rij.appendChild(wrEl('span', null, 'van'));
        rij.appendChild(van);
        rij.appendChild(wrEl('span', null, 'tot'));
        rij.appendChild(tot);
        rij.appendChild(wrEl('span', null, '°'));
        rij.appendChild(weg);
        blok.appendChild(rij);
      });
      var plus = wrEl('button', 'klein secundair', '+ bereik');
      plus.type = 'button';
      plus.onclick = function () { bereiken[type].push(['', '']); render(); };
      blok.appendChild(plus);
      return blok;
    }

    function render() {
      wrapper.innerHTML = '';
      if (opties.ondertitel) wrapper.appendChild(wrEl('p', 'wr-uitleg', opties.ondertitel));
      wrapper.appendChild(wrEl('p', 'wr-uitleg',
        'Kies de windrichtingen waarbij je op deze spot wilt kiten: wind vanaf het water of schuin aanlandig. ' +
        'Een richting die je niet kiest geeft altijd een rood oordeel — laat aflandige wind (van land naar zee) dus uit. ' +
        'Elke spot is anders: aan zee is oost vaak aflandig, aan het IJsselmeer kan oost juist prima zijn.'));

      if (opties.preset) {
        var presetKnop = wrEl('button', 'klein secundair wr-preset', '📍 Voorgestelde richtingen voor ' + opties.preset.preset.naam + ' invullen');
        presetKnop.type = 'button';
        presetKnop.onclick = function () { laadUit(opties.preset.windrichting); gewijzigd = true; render(); };
        wrapper.appendChild(presetKnop);
        wrapper.appendChild(wrEl('p', 'wr-uitleg', 'Een richtlijn op basis van de ligging van de kust — controleer ter plekke of bij de kitesurfvereniging en pas aan waar nodig.'));
      }

      if (modus === 'kompas') {
        var tabs = wrEl('div', 'wr-tabs');
        [
          ['slecht', '❌ Slechte wind'],
          ['goed', '✅ Goede wind'],
          ['los', '🎨 Per richting'],
        ].forEach(function (t) {
          var knop = wrEl('button', 'wr-tab' + (actieModus === t[0] ? ' actief' : ''), t[1]);
          knop.type = 'button';
          knop.onclick = function () {
            actieModus = t[0];
            bereikStart = null;
            render();
          };
          tabs.appendChild(knop);
        });
        wrapper.appendChild(tabs);

        var hintTekst = actieModus === 'slecht'
          ? (bereikStart != null
            ? 'Start: ' + KOMPAS_PUNTEN[bereikStart] + ' — tik nu de eindrichting van de slechte wind (met de klok mee).'
            : 'Tik begin en eind van de slechte (aflandige) wind — de rest wordt automatisch groen.')
          : actieModus === 'goed'
            ? (bereikStart != null
              ? 'Start: ' + KOMPAS_PUNTEN[bereikStart] + ' — tik nu de eindrichting van het goede bereik (met de klok mee).'
              : 'Tik begin en eind van het goede bereik (met de klok mee).')
            : 'Tik op een losse richting om bij te stellen: slecht → beste → matig.';

        var roosWrap = wrEl('div', 'wr-roos-wrap');
        var svgNs = 'http://www.w3.org/2000/svg';
        var svg = document.createElementNS(svgNs, 'svg');
        svg.setAttribute('class', 'wr-roos');
        svg.setAttribute('viewBox', '0 0 260 260');
        var cx = 130, cy = 130, rUit = 114, rIn = 42, rLabel = 82;
        KOMPAS_PUNTEN.forEach(function (naam, i) {
          var a1 = (i * 22.5 - 11.25 - 90) * Math.PI / 180;
          var a2 = (i * 22.5 + 11.25 - 90) * Math.PI / 180;
          var am = (i * 22.5 - 90) * Math.PI / 180;
          var d = [
            'M', (cx + rUit * Math.cos(a1)).toFixed(1), (cy + rUit * Math.sin(a1)).toFixed(1),
            'A', rUit, rUit, 0, 0, 1, (cx + rUit * Math.cos(a2)).toFixed(1), (cy + rUit * Math.sin(a2)).toFixed(1),
            'L', (cx + rIn * Math.cos(a2)).toFixed(1), (cy + rIn * Math.sin(a2)).toFixed(1),
            'A', rIn, rIn, 0, 0, 0, (cx + rIn * Math.cos(a1)).toFixed(1), (cy + rIn * Math.sin(a1)).toFixed(1),
            'Z',
          ].join(' ');
          var pad = document.createElementNS(svgNs, 'path');
          pad.setAttribute('d', d);
          pad.setAttribute('class', 'wr-taart stand-' + standen[i] + (bereikStart === i ? ' start-punt' : ''));
          pad.onclick = function () {
            if (actieModus === 'los') {
              standen[i] = (standen[i] + 1) % 3;
              gewijzigd = true;
              render();
              return;
            }
            if (bereikStart === null) {
              bereikStart = i;
              render();
            } else {
              standen = windrichtingLogica.pasBereikToeOpStanden(standen, bereikStart, i, actieModus);
              bereikStart = null;
              gewijzigd = true;
              render();
            }
          };
          svg.appendChild(pad);
          var lbl = document.createElementNS(svgNs, 'text');
          lbl.setAttribute('x', (cx + rLabel * Math.cos(am)).toFixed(1));
          lbl.setAttribute('y', (cy + rLabel * Math.sin(am)).toFixed(1));
          lbl.setAttribute('class', 'wr-taart-label' + (standen[i] > 0 ? ' licht' : ''));
          lbl.textContent = naam;
          svg.appendChild(lbl);
        });
        var midden = document.createElementNS(svgNs, 'text');
        midden.setAttribute('x', cx);
        midden.setAttribute('y', cy);
        midden.setAttribute('class', 'wr-taart-label');
        midden.textContent = actieModus === 'slecht' ? 'Aflandig' : actieModus === 'goed' ? 'Bereik' : 'Los';
        svg.appendChild(midden);
        roosWrap.appendChild(svg);
        roosWrap.appendChild(wrEl('div', 'wr-roos-hint', hintTekst));
        wrapper.appendChild(roosWrap);

        var legenda = wrEl('div', 'wr-legenda');
        legenda.appendChild(wrEl('span', 'l-uit', 'Niet geschikt'));
        legenda.appendChild(wrEl('span', 'l-beste', 'Beste'));
        legenda.appendChild(wrEl('span', 'l-matig', 'Matig'));
        wrapper.appendChild(legenda);
      } else {
        wrapper.appendChild(wrEl('p', 'wr-uitleg', 'Geef de windrichting in graden (0–360°, 0 = noord, 90 = oost, 180 = zuid, 270 = west). Loopt een bereik over noord heen (bv. 340 tot 20), vul dat gewoon zo in.'));
        wrapper.appendChild(bouwBereikRijen('beste', 'Beste richtingen'));
        wrapper.appendChild(bouwBereikRijen('matig', 'Matige richtingen (optioneel)'));
      }

      samenvattingEl = wrEl('div', 'wr-samenvatting');
      wrapper.appendChild(samenvattingEl);
      werkSamenvattingBij();

      var wissel = wrEl('button', 'wr-modus', modus === 'kompas' ? 'Liever graden invoeren' : 'Liever kompasvakjes gebruiken');
      wissel.type = 'button';
      wissel.onclick = function () {
        var nu = lees();
        if (nu.fout) { samenvattingEl.textContent = nu.fout; return; }
        laadUit(nu.windrichting);
        modus = modus === 'kompas' ? 'graden' : 'kompas';
        render();
      };
      wrapper.appendChild(wissel);
    }

    render();
    return { element: wrapper, lees: lees };
  }

  function toonWindrichtingMelding(tekst) {
    var el = document.getElementById('windrichtingMelding');
    el.textContent = tekst || '';
    el.hidden = !tekst;
  }

  /**
   * Opent het windrichting-scherm. opties: { titel, ondertitel, windrichting, preset,
   * onOpslaan(windrichting, klaar(foutTekst|null)), naSluiten() }. De kaart/wizard/instellingen die
   * open stonden worden tijdelijk verborgen en na sluiten hersteld.
   */
  function openWindrichtingEditor(opties) {
    var container = document.getElementById('windrichtingEditor');
    container.innerHTML = '';
    document.getElementById('windrichtingTitel').textContent = opties.titel;
    var editor = bouwWindrichtingEditor({
      windrichting: opties.windrichting,
      modus: windrichtingWeergaveVoorkeur(),
      preset: opties.preset,
      ondertitel: opties.ondertitel,
    });
    container.appendChild(editor.element);
    toonWindrichtingMelding(null);
    windrichtingHuidig = { editor: editor, opties: opties };
    windrichtingTerugTeZetten = ['instellingenSectie', 'onboardingWizard'].filter(function (id) {
      return !document.getElementById(id).hidden;
    });
    windrichtingTerugTeZetten.forEach(verberg);
    toon('windrichtingSectie');
    springNaar('windrichtingSectie');
  }

  function sluitWindrichtingEditor() {
    verberg('windrichtingSectie');
    var opties = windrichtingHuidig ? windrichtingHuidig.opties : null;
    windrichtingHuidig = null;
    windrichtingTerugTeZetten.forEach(toon);
    windrichtingTerugTeZetten = [];
    if (opties && opties.naSluiten) opties.naSluiten();
  }

  function windrichtingOpslaan() {
    if (!windrichtingHuidig) return;
    var r = windrichtingHuidig.editor.lees();
    if (r.fout) { toonWindrichtingMelding(r.fout); return; }
    if (r.windrichting.besteRanges.length === 0 && r.windrichting.acceptabeleRanges.length === 0) {
      toonWindrichtingMelding('Kies minstens één windrichting waarbij je op deze spot wilt kiten.');
      return;
    }
    windrichtingHuidig.opties.onOpslaan(r.windrichting, function (fout) {
      if (fout) toonWindrichtingMelding(fout);
      else sluitWindrichtingEditor();
    });
  }

  /** Windrichting van een bestaande favoriete spot aanpassen (alle plekken waar dat kan). */
  function bewerkWindrichtingVanSpot(locatie, naSluiten) {
    openWindrichtingEditor({
      titel: 'Windrichting — ' + locatie.naam,
      windrichting: locatie.windrichting,
      preset: windrichtingLogica.zoekSpotPreset(locatie.lat, locatie.lon),
      onOpslaan: function (windrichting, klaar) {
        toonLaad(true);
        run('updateFavorieteLocatieWindrichtingServer', gebruikerId, locatie.id, windrichting)
          .then(function (r) {
            toonLaad(false);
            if (r.fouten && r.fouten.length) { klaar(r.fouten.join(', ')); return; }
            profiel = r.profiel;
            if (huidigeLocatie && huidigeLocatie.id === locatie.id) {
              huidigeLocatie = (profiel.favorieteLocaties || []).filter(function (l) { return l.id === locatie.id; })[0] || huidigeLocatie;
            }
            klaar(null);
          })
          .catch(function (e) { toonLaad(false); klaar(String(e.message || e)); });
      },
      naSluiten: naSluiten,
    });
  }

  function werkWindrichtingSamenvattingBij() {
    var el = document.getElementById('windrichtingSamenvatting');
    if (!el) return;
    el.textContent = huidigeLocatie
      ? '🧭 Vaarbaar bij ' + windrichtingLogica.formatWindrichtingSamenvatting(huidigeLocatie.windrichting, windrichtingWeergaveVoorkeur()).replace('Beste: ', 'beste: ').replace(' · Matig: ', ' · matig: ')
      : '';
  }

  // --- Instellingen (drempelwaarden + meldingen) ---

  function openInstellingen() {
    verberg('onboardingWizard');
    renderInstellingenFormulier();
    toon('instellingenSectie');
    springNaar('instellingenSectie');
  }

  // Werkt met/zonder Clipboard API (die kan ontbreken/geweigerd worden binnen de HtmlService-
  // iframe) — bij weigering blijft de zichtbare, selecteerbare ID-tekst (user-select: all, zie
  // .link-banner-url) de handmatige terugval, vandaar de duidelijke knoptekst in dat geval.
  function kopieerNaarKlembord(tekst, knop) {
    var oorspronkelijk = knop.textContent;
    function terugzetten() { setTimeout(function () { knop.textContent = oorspronkelijk; }, 1500); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(tekst).then(function () {
        knop.textContent = '✓ Gekopieerd';
        terugzetten();
      }).catch(function () {
        knop.textContent = 'Selecteer hierboven en kopieer';
        terugzetten();
      });
    } else {
      knop.textContent = 'Selecteer hierboven en kopieer';
      terugzetten();
    }
  }

  /**
   * Keuze "windrichting tonen als kompas of graden" + de lijst favoriete spots met hun windrichting
   * en een Aanpassen-knop per spot. Gedeeld door ⚙️ Instellingen en de Instelhulp (wizard stap 5).
   */
  function bouwWindrichtingKeuzeBlok(selectId, naSluiten) {
    var blok = wrEl('div');
    var rij = wrEl('div', 'veldrij');
    var label = wrEl('label', null, 'Windrichting tonen als');
    label.htmlFor = selectId;
    var select = wrEl('select');
    select.id = selectId;
    select.style.width = '160px';
    [['kompas', 'Kompas (bv. ZW)'], ['graden', 'Graden (bv. 225°)']].forEach(function (o) {
      var opt = wrEl('option', null, o[1]);
      opt.value = o[0];
      select.appendChild(opt);
    });
    select.value = windrichtingWeergaveVoorkeur();
    rij.appendChild(label);
    rij.appendChild(select);
    blok.appendChild(rij);

    var lijst = wrEl('div');
    function renderLijst() {
      lijst.innerHTML = '';
      (profiel.favorieteLocaties || []).forEach(function (loc) {
        var spotRij = wrEl('div', 'wr-spotrij');
        var tekstDeel = wrEl('div');
        tekstDeel.appendChild(document.createTextNode(loc.naam));
        tekstDeel.appendChild(wrEl('small', null, windrichtingLogica.formatWindrichtingSamenvatting(loc.windrichting, windrichtingWeergaveVoorkeur())));
        var knop = wrEl('button', 'klein secundair', '🧭 Aanpassen');
        knop.type = 'button';
        knop.onclick = function () { bewerkWindrichtingVanSpot(loc, naSluiten); };
        spotRij.appendChild(tekstDeel);
        spotRij.appendChild(knop);
        lijst.appendChild(spotRij);
      });
    }
    select.onchange = function () {
      profiel.windrichtingWeergave = select.value === 'graden' ? 'graden' : 'kompas';
      renderLijst();
    };
    renderLijst();
    blok.appendChild(lijst);
    return blok;
  }

  function renderInstellingenFormulier() {
    var container = document.getElementById('instellingenFormulier');
    container.innerHTML = '';

    // Instelhulp: de stapsgewijze uitleg is niet alleen voor de eerste keer — hier altijd opnieuw te starten.
    var instelhulpGroep = document.createElement('div');
    instelhulpGroep.className = 'veldgroep';
    instelhulpGroep.innerHTML =
      '<h3>🧙 Instelhulp</h3>' +
      '<p class="uitleg">Loop stap voor stap, met uitleg per onderdeel, opnieuw door alle instellingen. ' +
      'Handig om iets bij te stellen of als je niet meer weet wat een instelling doet. Je huidige waarden staan alvast ingevuld.</p>';
    var instelhulpKnop = document.createElement('button');
    instelhulpKnop.className = 'klein';
    instelhulpKnop.textContent = 'Instelhulp opnieuw doorlopen';
    instelhulpKnop.onclick = openOnboardingWizard;
    instelhulpGroep.appendChild(instelhulpKnop);
    container.appendChild(instelhulpGroep);

    var windrichtingGroep = document.createElement('div');
    windrichtingGroep.className = 'veldgroep';
    windrichtingGroep.innerHTML =
      '<h3>🧭 Windrichting</h3>' +
      '<p class="uitleg">Kies of windrichtingen als kompas (ZW) of in graden (225°) getoond en ingevoerd worden — ' +
      'nooit allebei tegelijk. Per favoriete spot bepaal je zelf bij welke windrichtingen je wilt kiten ' +
      '(aflandig = onveilig, en dat verschilt per spot).</p>';
    windrichtingGroep.appendChild(bouwWindrichtingKeuzeBlok('veld-windrichtingweergave', renderInstellingenFormulier));
    container.appendChild(windrichtingGroep);

    // Deel-link: een NIEUW, willekeurig gebruikers-ID (los van dat van deze gebruiker) in de URL,
    // zodat wie deze link opent een eigen, lege profiel krijgt i.p.v. per ongeluk mee te lezen/
    // schrijven in dít profiel — dat zou gebeuren als je gewoon de "bewaar deze link"-link
    // hierboven doorstuurt (die bevat immers je eigen ID). Het ID wordt server-side gegenereerd
    // (bouwDeelLink in Code.gs). Er wordt pas een Drive-bestand voor dat ID aangemaakt zodra de
    // ontvanger de link daadwerkelijk opent en iets opslaat.
    var deelGroep = document.createElement('div');
    deelGroep.className = 'veldgroep';
    deelGroep.innerHTML =
      '<h3>🔗 Deel deze app</h3>' +
      '<p class="uitleg">Genereer een korte link met een gloednieuw ID voor iemand anders — die ' +
      'krijgt dan een eigen, lege start i.p.v. jouw profiel te openen.</p>';
    var deelKnop = document.createElement('button');
    deelKnop.className = 'klein secundair';
    deelKnop.textContent = 'Genereer deel-link';
    var deelLinkBanner = document.createElement('div');
    deelLinkBanner.className = 'link-banner';
    deelLinkBanner.style.marginTop = '10px';
    deelLinkBanner.hidden = true;
    var deelLinkTekst = document.createElement('div');
    deelLinkTekst.className = 'link-banner-url';
    deelLinkBanner.appendChild(deelLinkTekst);
    var deelKnoppenRij = document.createElement('div');
    deelKnoppenRij.style.marginTop = '8px';
    deelKnoppenRij.style.display = 'flex';
    deelKnoppenRij.style.gap = '8px';
    var deelKopieerKnop = document.createElement('button');
    deelKopieerKnop.className = 'klein secundair';
    deelKopieerKnop.textContent = 'Kopieer';
    deelKnoppenRij.appendChild(deelKopieerKnop);
    // navigator.share opent het systeem-deelmenu (WhatsApp, Telegram, e-mail, sms, ...) — niet
    // overal beschikbaar (vooral desktop-browsers missen 'm), dus alleen tonen als de functie
    // daadwerkelijk bestaat i.p.v. een knop die het dan alsnog niet doet.

    dagvensterGroep.appendChild(bouwNummerVeldVoorObject(profiel.dagvenster, 'eindUur', 'Tot uur (0-23)', 'veld-dagvenster-eind'));

      'minder bronnen (minder betrouwbaar) — open bij een dag het uitklapmenu om te zien welke ' +

    horizonGroep.appendChild(bouwNummerVeldVoorObject(profiel, 'dagenVooruit', 'Aantal dagen (1-10)', 'veld-dagenvooruit'));
    container.appendChild(horizonGroep);

    var sessieGroep = document.createElement('div');

    sessieGroep.appendChild(bouwNummerVeldVoorObject(profiel, 'minimaleSessieUren', 'Aantal uren (1-8)', 'veld-minimalesessieuren'));
    container.appendChild(sessieGroep);

    // Score-berekening: uitklapmenu (details/summary — dit is een instelling voor gevorderde

    // WERKKOPIE (werkbareScoreGewichten), niet rechtstreeks op profiel.scoreGewichten: toevoegen/
    // verwijderen in de tabel moet meteen zichtbaar zijn zonder dat een druk op "Sluiten" (i.p.v.
    // "Opslaan") die wijziging alsnog laat beklijven.
    werkbareScoreGewichten = Object.assign({}, profiel.scoreGewichten);
    var gewichtenDetails = document.createElement('details');
    gewichtenDetails.className = 'veldgroep';
    var gewichtenSamenvatting = document.createElement('summary');
    gewichtenSamenvatting.innerHTML = '<h3 style="display:inline">Score-berekening</h3>';

    DREMPEL_VELDEN.forEach(function (groep) {

      groep.velden.forEach(function (veld) {

  function bouwNummerVeld(pad, key, label) {
    return bouwNummerVeldVoorObject(profiel.drempelwaarden[pad], key, label, 'veld-' + pad + '-' + key);
  }

  function bouwNummerVeldVoorObject(obj, key, label, id) {
    var rij = document.createElement('div');
    rij.className = 'veldrij';
    var labelEl = document.createElement('label');
    labelEl.textContent = label;
    var input = document.createElement('input');
    input.type = 'number';
    input.step = 'any';
    input.id = id;
    var waarde = obj[key];
    input.value = waarde == null ? '' : waarde;
    rij.appendChild(labelEl);
    rij.appendChild(input);
    return rij;
  }

  /**
   * Eén <input type="time"> i.p.v. twee losse uur/minuut-getalvelden — dat was onnodig omslachtig
   * en een aparte bron van fouten (een leeg of ongeldig uur-veld met een prima minuut-veld).
   * `meldingenObj.samenvattingUur`/`.samenvattingMinuut` blijven de opslagvorm (server-side
   * ongewijzigd); dit veld zet dat alleen om naar/van "HH:MM" voor de browser-tijdpicker.
   */
  function bouwTijdstipVeld(meldingenObj, id) {
    var rij = document.createElement('div');
    rij.className = 'veldrij';
    var labelEl = document.createElement('label');
    labelEl.textContent = 'Tijdstip';
    var input = document.createElement('input');
    input.type = 'time';
    input.id = id;
    var uur = meldingenObj.samenvattingUur != null ? meldingenObj.samenvattingUur : 8;
    var minuut = meldingenObj.samenvattingMinuut != null ? meldingenObj.samenvattingMinuut : 0;
    input.value = String(uur).padStart(2, '0') + ':' + String(minuut).padStart(2, '0');
    rij.appendChild(labelEl);
    rij.appendChild(input);
    return rij;
  }

  /** Actieve criteria, in een vaste, leesbare volgorde (niet de willekeurige object-sleutelvolgorde). */
  function sorteerActieveGewichtSleutels() {
    return SCORE_GEWICHTEN_VELDEN.map(function (v) { return v.key; })
      .filter(function (key) { return key in werkbareScoreGewichten; });
  }

  /**
   * Leest de zichtbare gewicht-inputs terug in werkbareScoreGewichten vóórdat de tabel opnieuw
   * opgebouwd wordt (toevoegen/verwijderen/herstellen) — anders zou een net getypte aanpassing in
   * een andere rij verloren gaan zodra de tabel herrendert.
   */
  function synchroniseerGewichtenVanuitDom() {
    Object.keys(werkbareScoreGewichten).forEach(function (key) {
      var input = document.getElementById('veld-gewicht-' + key);
      if (!input) return;
      var raw = input.value.trim();
      if (raw !== '' && !isNaN(Number(raw))) werkbareScoreGewichten[key] = Number(raw);
    });
  }

  /**
   * Bouwt de score-gewichten-tabel (in `houder`) plus de "variabele toevoegen"-rij en de
   * "Herstel standaard"-knop, op basis van werkbareScoreGewichten. Zelf-herroepend: elke
   * toevoeg/verwijder/herstel-actie roept dit gewoon opnieuw aan i.p.v. losse DOM-patches bij te
   * houden — bij een tabel van hooguit ~10 rijen is dat eenvoudiger en net zo snel.
   */
  function herrenderScoreGewichtenTabel(houder) {
    houder.innerHTML = '';

    var table = document.createElement('table');
    table.className = 'uurtabel';
    table.innerHTML = '<tr><th>Variabele</th><th>Gewicht</th><th></th></tr>';
    sorteerActieveGewichtSleutels().forEach(function (key) {
      var tr = document.createElement('tr');
      var tdLabel = document.createElement('td');
      tdLabel.textContent = scoreGewichtLabel(key);
      var tdInput = document.createElement('td');
      var input = document.createElement('input');
      input.type = 'number';
      input.step = 'any';
      input.min = '0';
      input.id = 'veld-gewicht-' + key;
      input.value = werkbareScoreGewichten[key];
      tdInput.appendChild(input);
      var tdVerwijder = document.createElement('td');
      var verwijderKnop = document.createElement('button');
      verwijderKnop.type = 'button';
      verwijderKnop.className = 'klein secundair';
      verwijderKnop.textContent = '✕';
      verwijderKnop.title = 'Verwijder ' + scoreGewichtLabel(key);
      verwijderKnop.onclick = function () {
        synchroniseerGewichtenVanuitDom();
        delete werkbareScoreGewichten[key];
        herrenderScoreGewichtenTabel(houder);
      };
      tdVerwijder.appendChild(verwijderKnop);
      tr.appendChild(tdLabel);
      tr.appendChild(tdInput);
      tr.appendChild(tdVerwijder);
      table.appendChild(tr);
    });
    houder.appendChild(table);

    // Alleen variabelen die nog niet in de tabel staan zijn te kiezen — zodra iets is toegevoegd
    // verdwijnt het vanzelf uit deze lijst (die wordt bij elke herrender opnieuw opgebouwd).
    var beschikbaar = SCORE_GEWICHTEN_VELDEN.filter(function (v) { return !(v.key in werkbareScoreGewichten); });
    if (beschikbaar.length > 0) {
      var toevoegRij = document.createElement('div');
      toevoegRij.className = 'veldrij';
      var select = document.createElement('select');
      select.id = 'veld-gewicht-nieuw';
      beschikbaar.forEach(function (v) {
        var optie = document.createElement('option');
        optie.value = v.key;
        optie.textContent = v.label;
        select.appendChild(optie);
      });
      var toevoegKnop = document.createElement('button');
      toevoegKnop.type = 'button';
      toevoegKnop.className = 'klein';
      toevoegKnop.textContent = '+ Toevoegen';
      toevoegKnop.onclick = function () {
        synchroniseerGewichtenVanuitDom();
        var nieuweKey = select.value;
        // De ingebouwde standaardwaarde als startgewicht als die bestaat (bv. bij "Herstellen"
        // van iets dat er al eens uit is gehaald); anders 0,1 als zichtbaar, niet-nul startpunt.
        werkbareScoreGewichten[nieuweKey] = STANDAARD_SCORE_GEWICHTEN[nieuweKey] != null ? STANDAARD_SCORE_GEWICHTEN[nieuweKey] : 0.1;
        herrenderScoreGewichtenTabel(houder);
      };
      toevoegRij.appendChild(select);
      toevoegRij.appendChild(toevoegKnop);
      houder.appendChild(toevoegRij);
    }

    var herstelKnop = document.createElement('button');
    herstelKnop.type = 'button';
    herstelKnop.className = 'klein secundair';
    herstelKnop.textContent = 'Herstel standaard';
    herstelKnop.style.marginTop = '8px';
    herstelKnop.onclick = function () {
      werkbareScoreGewichten = Object.assign({}, STANDAARD_SCORE_GEWICHTEN);
      herrenderScoreGewichtenTabel(houder);
    };
    houder.appendChild(herstelKnop);
  }

  function bouwCheckboxVeld(pad, key, label) {
    return bouwCheckboxVeldVoorObject(profiel.drempelwaarden[pad], key, label, 'veld-' + pad + '-' + key);
  }

  function bouwCheckboxVeldVoorObject(obj, key, label, id) {
    var rij = document.createElement('div');
    rij.className = 'veldrij';
    var labelEl = document.createElement('label');
    labelEl.textContent = label;
    var input = document.createElement('input');
    input.type = 'checkbox';
    input.id = id;
    input.checked = !!obj[key];
    rij.appendChild(labelEl);
    rij.appendChild(input);
    return rij;
  }

  function opslaanInstellingen() {
    profiel.meldingen.dagelijkseSamenvatting = document.getElementById('veld-meldingen-samenvatting').checked;
    var tijdstip = document.getElementById('veld-meldingen-samenvattingtijd').value; // "HH:MM"
    if (tijdstip) {
      var delen = tijdstip.split(':');
      profiel.meldingen.samenvattingUur = Number(delen[0]);
      profiel.meldingen.samenvattingMinuut = Number(delen[1]);
    }
    profiel.meldingen.directeAlert = document.getElementById('veld-meldingen-directealert').checked;
    profiel.dagvenster.startUur = Number(document.getElementById('veld-dagvenster-start').value);
    profiel.dagvenster.eindUur = Number(document.getElementById('veld-dagvenster-eind').value);
    profiel.dagenVooruit = Number(document.getElementById('veld-dagenvooruit').value);
    profiel.minimaleSessieUren = Number(document.getElementById('veld-minimalesessieuren').value);
    profiel.windrichtingWeergave = document.getElementById('veld-windrichtingweergave').value === 'graden' ? 'graden' : 'kompas';

    // De tabel bepaalt nu zelf welke criteria meetellen (toevoegen/verwijderen, zie
    // herrenderScoreGewichtenTabel) — eerst de laatst getypte gewichten uit de zichtbare rijen
    // overnemen, dan die complete werkkopie (niet gemerged met wat er eerder stond) als nieuwe
    // profiel.scoreGewichten vastleggen.
    synchroniseerGewichtenVanuitDom();
    profiel.scoreGewichten = Object.assign({}, werkbareScoreGewichten);

    DREMPEL_VELDEN.forEach(function (groep) {
      groep.velden.forEach(function (veld) {
        var input = document.getElementById('veld-' + groep.pad + '-' + veld.key);
        var raw = input.value.trim();
        profiel.drempelwaarden[groep.pad][veld.key] = raw === '' ? null : Number(raw);
      });
      if (groep.checkbox) {
        var cb = document.getElementById('veld-' + groep.pad + '-' + groep.checkbox.key);
        profiel.drempelwaarden[groep.pad][groep.checkbox.key] = cb.checked;
      }
    });
    profiel.drempelwaarden.getij.voorkeur = document.getElementById('veld-getij-voorkeur').value;

    // Zichtbare bevestiging op de knop zelf: zonder dit sloot het paneel meteen en onopvallend,
    // wat het onterecht deed lijken alsof er niets was opgeslagen (gebruikersmelding). Geen
    // `disabled` hier — bij een mislukte opslag (zie slaProfielOp's catch) moet de knop gewoon
    // weer bruikbaar zijn, niet vastzitten op uitgeschakeld.
    var knop = document.getElementById('opslaanInstellingenKnop');
    var oorspronkelijkeTekst = knop.textContent;
    slaProfielOp(function () {
      werkConfiguratieBannerBij();
      knop.textContent = '✓ Opgeslagen';
      setTimeout(function () {
        knop.textContent = oorspronkelijkeTekst;
        verberg('instellingenSectie');
        if (huidigeLocatie) kiesLocatie(huidigeLocatie);
      }, 900);
    });
  }

  // --- Databronnen (aparte instellingenknop) ---

  function openBronnen() {
    renderBronnenFormulier();
    toon('bronnenSectie');
    springNaar('bronnenSectie');
  }

  function renderBronnenFormulier() {
    var container = document.getElementById('bronnenFormulier');
    container.innerHTML = '';
    DATABRON_VELDEN.forEach(function (veld) {
      container.appendChild(bouwCheckboxVeldVoorObject(profiel.databronnen, veld.key, veld.label, 'veld-bron-' + veld.key));
    });
  }

  function opslaanBronnen() {
    DATABRON_VELDEN.forEach(function (veld) {
      profiel.databronnen[veld.key] = document.getElementById('veld-bron-' + veld.key).checked;
    });
    slaProfielOp(function () {
      verberg('bronnenSectie');
      if (huidigeLocatie) kiesLocatie(huidigeLocatie);
    });
  }

  function slaProfielOp(daarnaAction) {
    toonLaad(true);
    run('saveProfiel', gebruikerId, profiel)
      .then(function (r) {
        profiel = r.profiel;
        toonLaad(false);
        if (daarnaAction) daarnaAction();
      })
      .catch(function (e) { toonLaad(false); toonFout(String(e.message || e)); });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('zoekKnop').onclick = zoeken;
    document.getElementById('zoekInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') zoeken();
    });
    // De topbar-knoppen werken als toggle (nogmaals klikken sluit het paneel weer) — niet alleen
    // via de "Sluiten"-knop onderaan het (soms lange) formulier, die anders de enige manier was
    // om weer in te klappen.
    document.getElementById('instellingenKnop').onclick = function () {
      if (document.getElementById('instellingenSectie').hidden) openInstellingen();
      else verberg('instellingenSectie');
    };
    document.getElementById('nuInstellenKnop').onclick = openInstellingen;
    document.getElementById('sluitInstellingenKnop').onclick = function () { verberg('instellingenSectie'); };
    document.getElementById('opslaanInstellingenKnop').onclick = opslaanInstellingen;
    document.getElementById('bronnenKnop').onclick = function () {
      if (document.getElementById('bronnenSectie').hidden) openBronnen();
      else verberg('bronnenSectie');
    };
    document.getElementById('sluitBronnenKnop').onclick = function () { verberg('bronnenSectie'); };
    document.getElementById('opslaanBronnenKnop').onclick = opslaanBronnen;
    document.getElementById('verwijderLocatieKnop').onclick = verwijderHuidigeLocatie;
    document.getElementById('windrichtingLocatieKnop').onclick = function () {
      if (!huidigeLocatie) return;
      bewerkWindrichtingVanSpot(huidigeLocatie, function () {
        if (huidigeLocatie) kiesLocatie(huidigeLocatie);
      });
    };
    document.getElementById('windrichtingOpslaanKnop').onclick = windrichtingOpslaan;
    document.getElementById('windrichtingAnnuleerKnop').onclick = sluitWindrichtingEditor;
    document.getElementById('vergelijkKnop').onclick = openVergelijk;
    document.getElementById('sluitVergelijkKnop').onclick = function () { verberg('vergelijkSectie'); };
    document.getElementById('themaKnop').onclick = wisselThema;
    werkThemaKnopBij();
    document.getElementById('onboardingKnop').onclick = openOnboardingWizard;
    document.getElementById('wizardSluitKnop').onclick = sluitOnboardingWizard;
    document.getElementById('wizardOverslaanKnop').onclick = sluitOnboardingWizard;
    document.getElementById('wizardVorigeKnop').onclick = function () {
      gaNaarWizardStap(wizardHuidigeStap - 1);
    };
    document.getElementById('wizardVolgendeKnop').onclick = function () {
      if (wizardHuidigeStap >= WIZARD_AANTAL_STAPPEN - 1) slaOnboardingWizardOp();
      else gaNaarWizardStap(wizardHuidigeStap + 1);
    };
    init();
  });
</script>
